[package]
name = "rust-lapper"
version = "2.0.0"
authors = ["Seth Stadick <sstadick@gmail.com>"]
edition = "2018"
rust-version = "1.59"
license = "MIT"
repository = "https://github.com/sstadick/rust-lapper"
description = "A fast and easy interval overlap library"
documentation = "https://docs.rs/rust-lapper"
readme = "README.md"
include = [
    "/src/**",
    "/tests/**",
    "/benches/**",
    "/examples/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
]
categories = ["algorithms", "science"]
keywords = ["tree", "interval", "bioinformatics", "ranges", "genomic"]

[[example]]
name = "serde"
required-features = ["with_serde"]

[[example]]
name = "ex1"

[features]
default = []
with_serde = ["serde/derive"]
sort_unstable = []

[dependencies]
num-traits = "0.2.12"
serde = { version = "1.0.127", features = ["derive"], optional = true }

[dev-dependencies]
# Criterion 0.4 is the newest release compatible with the Rust 1.59 MSRV.
criterion = { version = "0.4", default-features = false, features = ["cargo_bench_support"] }
rand = "0.8"
# Retain bincode 1.x to test compatibility with rust-lapper 1.x data.
bincode = "1.3.3"

[[bench]]
name = "lapper_benchmark"
harness = false
